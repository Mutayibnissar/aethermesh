name: Deploy AetherMesh to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethermesh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aethermesh.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare
          command: deploy
          wranglerVersion: "4"
